name: Daily Scrape

on:
  schedule:
    # Runs once a day at 22:00 UTC (~midnight Lithuania time, EET/EEST).
    # GitHub Actions cron has no timezone support, so this is a fixed UTC approximation.
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install LibreOffice (for CV PDF conversion)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p backend
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > backend/firebase-service-account.json

      - name: Run unicorns.lt scrape
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scraper/scrape.js

      - name: Run career-page job matching
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scraper/job-scraper.js

      - name: Run external job boards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scraper/external-jobs-scraper.js

      - name: Generate application CVs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node cv-builder/generate.js

      - name: Send applications (Gmail)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node cv-builder/apply.js

      - name: Check inbox for replies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node cv-builder/inbox.js
