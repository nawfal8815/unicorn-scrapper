name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Write frontend .env
        working-directory: frontend
        run: printf '%s\n' "${{ secrets.FRONTEND_ENV }}" > .env

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync frontend build
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/unicorn-scrapper/dist/

      - name: Sync backend code
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            --exclude node_modules \
            --exclude firebase-service-account.json \
            --exclude .env \
            backend/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/unicorn-scrapper/backend/

      - name: Install backend deps and restart service
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /var/www/unicorn-scrapper/backend && npm install --omit=dev && sudo systemctl restart unicorn-backend"
